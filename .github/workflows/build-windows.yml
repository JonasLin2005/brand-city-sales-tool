name: Build Windows EXE

# Runs on every push to main, and by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: pip install pyinstaller -r requirements.txt

      - name: Build the .exe
        run: pyinstaller --onefile --icon icon.ico --name brands_crawler crawler.py

      # Run the finished .exe on the demo workbooks so a broken build fails here,
      # not on a user's machine.
      - name: Smoke test on demo workbooks
        run: |
          Copy-Item workbooks\*.xlsx dist\
          dist\brands_crawler.exe --dir dist --dry-run

      # Download from the run's "Artifacts" section: the .exe plus demo workbooks.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: brands_crawler-windows
          path: dist/

  # The Mac version must give exactly what crawler.py gives.
  mac-version-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fill with both versions
        run: |
          cp -r workbooks a && cp -r workbooks b
          python crawler_mac.py --dir b
          pip install -r requirements.txt
          python crawler.py --dir a

      - name: Compare
        run: |
          python - <<'PY'
          import glob, os, sys
          from openpyxl import load_workbook
          bad = 0
          for f in glob.glob("a/*.xlsx"):
              a = load_workbook(f).active
              b = load_workbook(os.path.join("b", os.path.basename(f))).active
              bad += sum(ra != rb for ra, rb in zip(a.iter_rows(values_only=True),
                                                    b.iter_rows(values_only=True)))
          print("mismatched rows:", bad)
          sys.exit(1 if bad else 0)
          PY
